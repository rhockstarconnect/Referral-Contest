
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <title>Rhockstar Referral Contest Admin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #0b1120;
      color: #eaf2ff;
      font-family: Arial, sans-serif;
    }

    main { max-width: 1100px; margin: auto; }

    .panel {
      padding: 20px;
      margin-bottom: 20px;
      background: #111c30;
      border: 1px solid #263750;
      border-radius: 14px;
    }

    h1 { color: #38bdf8; }

    input, button, textarea, select {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 7px;
      border: 1px solid #263750;
      font-size: 15px;
    }

    input, textarea, select {
      color: white;
      background: #0b1425;
    }

    button {
      background: linear-gradient(90deg, #0284c7, #7c3aed);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }
    .hidden { display: none; }
    .error { color: #f87171; }
    .success { color: #4ade80; }
    .muted { color: #a4b3c9; }
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #263750;
      text-align: left;
      vertical-align: top;
    }

    th { color: #38bdf8; }
    a { color: #38bdf8; overflow-wrap: anywhere; }
  </style>
</head>

<body>
<main>
  <h1>Rhockstar Connect</h1>
  <p class="muted">Referral Contest Administration</p>

  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin email" autocomplete="username" required>

      <input id="password" type="password"
        placeholder="Password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">Log In</button>
    </form>

    <p id="loginMessage" role="status"></p>
  </section>

  <div id="dashboard" class="hidden">
    <section class="panel">
      <p id="adminEmail" class="muted"></p>
      <button id="refreshButton" type="button">Refresh Participants</button>
      <button id="logoutButton" type="button">Log Out</button>
      <p id="dashboardMessage" role="status"></p>
    </section>

    <section class="panel">
      <h2>Participants</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Clicks</th>
              <th>Status</th>
              <th>Referral Link</th>
              <th>Save</th>
            </tr>
          </thead>
          <tbody id="participants">
            <tr><td colspan="6">Sign in to load participants.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Prize Management</h2>
      <p class="muted">One prize per line: title | description</p>
      <textarea id="prizes" rows="7"
        placeholder="First Prize | Cash prize&#10;Second Prize | Premium account"></textarea>
      <button id="savePrizesButton" type="button">Save Prizes</button>
      <p id="prizeMessage" role="status"></p>
    </section>
  </div>
</main>

<script type="module">
  import { auth } from "./firebase.js";

  import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

  const $ = id => document.getElementById(id);
  let user = null;

  function message(id, text, type = "") {
    $(id).textContent = text;
    $(id).className = type;
  }

  async function api(action, data = {}) {
    if (!user) throw new Error("Please log in.");

    const token = await user.getIdToken();

    const response = await fetch("/.netlify/functions/admin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ action, ...data })
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.error || "Admin request failed.");
    }

    return result;
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("loginButton");
    button.disabled = true;
    message("loginMessage", "Signing in…");

    try {
      await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("password").value
      );
      message("loginMessage", "");
    } catch (error) {
      console.error("Firebase login error:", error);
      message(
        "loginMessage",
        "Login failed: " + error.code + " — " + error.message,
        "error"
      );
    } finally {
      button.disabled = false;
    }
  });

  onAuthStateChanged(auth, async currentUser => {
    user = currentUser;

    $("loginPanel").classList.toggle("hidden", !!user);
    $("dashboard").classList.toggle("hidden", !user);

    if (!user) return;

    $("adminEmail").textContent = "Signed in as " + (user.email || "");

    try {
      await loadParticipants();
      await loadPrizes();
    } catch (error) {
      message("dashboardMessage", error.message, "error");
    }
  });

  async function loadParticipants() {
    const result = await api("list");
    const entries = result.participants || [];
    const tbody = $("participants");
    tbody.replaceChildren();

    if (!entries.length) {
      const row = tbody.insertRow();
      const cell = row.insertCell();
      cell.colSpan = 6;
      cell.textContent = "No participants registered yet.";
      return;
    }

    for (const p of entries) {
      const row = tbody.insertRow();

      const nameCell = row.insertCell();
      const name = document.createElement("input");
      name.value = p.name || "";
      name.maxLength = 80;
      nameCell.appendChild(name);

      row.insertCell().textContent = p.email || "";

      const clickCell = row.insertCell();
      const clicks = document.createElement("input");
      clicks.type = "number";
      clicks.min = "0";
      clicks.step = "1";
      clicks.value = p.clicks || 0;
      clickCell.appendChild(clicks);

      const statusCell = row.insertCell();
      const status = document.createElement("select");

      ["pending", "approved", "rejected"].forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        option.selected = value === p.status;
        status.appendChild(option);
      });

      statusCell.appendChild(status);

      const linkCell = row.insertCell();
      if (p.referralCode) {
        const link = document.createElement("a");
        link.href = location.origin + "/ref/" +
          encodeURIComponent(p.referralCode);
        link.textContent = link.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        linkCell.appendChild(link);
      } else {
        linkCell.textContent = "No referral code";
      }

      const saveCell = row.insertCell();
      const save = document.createElement("button");
      save.textContent = "Save";

      save.addEventListener("click", async () => {
        const total = Number(clicks.value);

        if (!Number.isSafeInteger(total) || total < 0) {
          alert("Enter a valid non-negative whole number.");
          return;
        }

        save.disabled = true;

        try {
          await api("saveParticipant", {
            id: p.id,
            name: name.value.trim(),
            clicks: total,
            status: status.value,
            destination: p.destination
          });

          message("dashboardMessage", "Participant updated.", "success");
          await loadParticipants();
        } catch (error) {
          message("dashboardMessage", error.message, "error");
        } finally {
          save.disabled = false;
        }
      });

      saveCell.appendChild(save);
    }
  }

  async function loadPrizes() {
    const result = await api("getPrizes");
    $("prizes").value = (result.prizes || [])
      .map(p => p.title + " | " + (p.description || ""))
      .join("\n");
  }

  $("savePrizesButton").addEventListener("click", async () => {
    try {
      const prizes = $("prizes").value
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const i = line.indexOf("|");
          return i < 0
            ? { title: line, description: "" }
            : {
                title: line.slice(0, i).trim(),
                description: line.slice(i + 1).trim()
              };
        });

      await api("savePrizes", { prizes });
      message("prizeMessage", "Prizes saved successfully.", "success");
    } catch (error) {
      message("prizeMessage", error.message, "error");
    }
  });

  $("refreshButton").addEventListener("click", async () => {
    try {
      await loadParticipants();
      message("dashboardMessage", "Participants refreshed.", "success");
    } catch (error) {
      message("dashboardMessage", error.message, "error");
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    try {
      await signOut(auth);
    } catch (error) {
      message("dashboardMessage", error.message, "error");
    }
  });
</script>
</body>
</html>
