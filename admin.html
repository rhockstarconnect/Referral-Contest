
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhockstar Referral Admin</title>
<style>
body{margin:0;background:#0b1120;color:#eaf2ff;font:15px Arial;padding:20px}
main{max-width:1100px;margin:auto}
section{background:#111c30;border:1px solid #263750;border-radius:14px;padding:18px;margin-bottom:18px}
input,select,button,textarea{box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border-radius:7px;border:1px solid #34435d;background:#0b1425;color:white}
button{background:#2563eb;border:0;cursor:pointer;font-weight:bold}
.danger{background:#b91c1c}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px;border-bottom:1px solid #34435d;vertical-align:top}
.wrap{overflow-x:auto}
small{color:#a4b3c9;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Rhockstar Connect Admin</h1>

<section id="loginPanel">
<h2>Administrator login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin email" required>
<input id="password" type="password" placeholder="Password" required>
<button>Sign in</button>
</form>
<p id="status"></p>
</section>

<div id="dashboard" hidden>
<section>
<button id="logout">Sign out</button>
<h2>Participants</h2>
<button id="reload">Refresh participants</button>
<div class="wrap">
<table>
<thead><tr><th>Participant</th><th>Clicks</th><th>Status</th><th>Referral link</th><th>Save</th></tr></thead>
<tbody id="participants"></tbody>
</table>
</div>
</section>

<section>
<h2>Manage prizes</h2>
<p>Enter one prize per line, using this format: title | description</p>
<textarea id="prizes" rows="6" placeholder="1st Prize | Cash prize&#10;2nd Prize | Premium account"></textarea>
<button id="savePrizes">Save prizes</button>
</section>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "rhockstar-connect.firebaseapp.com",
  projectId: "rhockstar-connect",
  appId: "YOUR_FIREBASE_APP_ID"
});

const auth = getAuth(app);
const $ = id => document.getElementById(id);
let participants = [];

async function callAdmin(action, data = {}) {
  const user = auth.currentUser;
  if (!user) throw new Error("Please sign in.");

  const token = await user.getIdToken(true);
  const response = await fetch("/.netlify/functions/admin", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({action, ...data})
  });

  const result = await response.json();
  if (!response.ok) throw new Error(result.error || "Request failed.");
  return result;
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("status").textContent = "Signing in…";

  try {
    await signInWithEmailAndPassword(auth, $("email").value, $("password").value);
    $("status").textContent = "";
  } catch (error) {
    $("status").textContent = "Login failed: " + error.message;
  }
});

onAuthStateChanged(auth, async user => {
  $("loginPanel").hidden = !!user;
  $("dashboard").hidden = !user;

  if (user) {
    try {
      await loadParticipants();
      await loadPrizes();
    } catch (error) {
      $("status").textContent = error.message;
    }
  }
});

$("logout").onclick = () => signOut(auth);
$("reload").onclick = () => loadParticipants();

async function loadParticipants() {
  const result = await callAdmin("list");
  participants = result.participants;
  const body = $("participants");
  body.replaceChildren();

  participants.forEach(p => {
    const row = document.createElement("tr");

    function cell() {
      const td = document.createElement("td");
      row.appendChild(td);
      return td;
    }

    const nameCell = cell();
    const name = document.createElement("input");
    name.value = p.name || "";
    name.maxLength = 80;
    nameCell.appendChild(name);

    const clickCell = cell();
    const clicks = document.createElement("input");
    clicks.type = "number";
    clicks.min = "0";
    clicks.max = "1000000000";
    clicks.step = "1";
    clicks.value = p.clicks || 0;
    clickCell.appendChild(clicks);

    const statusCell = cell();
    const status = document.createElement("select");
    ["pending", "approved", "rejected"].forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      option.selected = value === p.status;
      status.appendChild(option);
    });
    statusCell.appendChild(status);

    const linkCell = cell();
    const link = document.createElement("small");
    link.textContent = location.origin + "/ref/" + p.referralCode;
    linkCell.appendChild(link);

    const actionCell = cell();
    const save = document.createElement("button");
    save.textContent = "Save";
    save.onclick = async () => {
      try {
        await callAdmin("saveParticipant", {
          id: p.id,
          name: name.value,
          clicks: Number(clicks.value),
          status: status.value,
          destination: p.destination
        });
        alert("Participant saved.");
        await loadParticipants();
      } catch (error) {
        alert(error.message);
      }
    };

    const remove = document.createElement("button");
    remove.textContent = "Delete";
    remove.className = "danger";
    remove.onclick = async () => {
      if (!confirm("Delete this participant?")) return;
      try {
        await callAdmin("deleteParticipant", {id: p.id});
        await loadParticipants();
      } catch (error) {
        alert(error.message);
      }
    };

    actionCell.append(save, remove);
    body.appendChild(row);
  });
}

async function loadPrizes() {
  const result = await callAdmin("getPrizes");
  $("prizes").value = (result.prizes || [])
    .map(p => p.title + " | " + (p.description || ""))
    .join("\n");
}

$("savePrizes").onclick = async () => {
  try {
    const prizes = $("prizes").value.split("\n")
      .map(line => line.trim())
      .filter(Boolean)
      .map(line => {
        const parts = line.split("|");
        return {
          title: (parts.shift() || "").trim(),
          description: parts.join("|").trim()
        };
      });

    await callAdmin("savePrizes", {prizes});
    alert("Prizes saved.");
  } catch (error) {
    alert(error.message);
  }
};
</script>
</body>
</html>
