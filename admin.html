
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhockstar Referral Contest Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    .container { max-width: 1100px; margin: auto; }
    h1, h2 { color: #38bdf8; }
    .panel {
      background: #1e293b; padding: 20px;
      margin: 18px 0; border-radius: 12px;
    }
    input, select, button {
      padding: 10px; margin: 5px 3px;
      border-radius: 6px; border: 1px solid #475569;
      font-size: 14px;
    }
    input, select { background: #0f172a; color: white; max-width: 100%; }
    button { cursor: pointer; background: #2563eb; color: white; border: 0; }
    button:hover { background: #1d4ed8; }
    .danger { background: #dc2626; }
    .success { color: #4ade80; }
    .error { color: #fca5a5; white-space: pre-wrap; }
    .muted { color: #94a3b8; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; }
    th { color: #38bdf8; }
    .hidden { display: none; }
    .status { font-weight: bold; }
    @media(max-width:600px) {
      body { padding: 10px; }
      .panel { padding: 12px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Rhockstar Referral Contest</h1>
  <p class="muted">Administrator dashboard</p>

  <div id="message" role="status" aria-live="polite"></div>

  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email"
             value="akusu2841@gmail.com" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
  </section>

  <main id="dashboard" class="hidden">
    <div class="panel">
      <span id="loggedInAs"></span>
      <button id="refreshBtn">Refresh Data</button>
      <button id="logoutBtn" class="danger">Log Out</button>
    </div>

    <div class="panel">
      <h2>Prize Settings</h2>
      <form id="prizeForm">
        <label>First prize (₦)
          <input id="prize1" type="number" min="0" required>
        </label>
        <label>Second prize (₦)
          <input id="prize2" type="number" min="0" required>
        </label>
        <label>Third prize (₦)
          <input id="prize3" type="number" min="0" required>
        </label>
        <button type="submit">Save Prize Settings</button>
      </form>
    </div>

    <div class="panel">
      <h2>Participants</h2>
      <input id="search" type="search"
             placeholder="Search name or email">
      <select id="statusFilter">
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      <p id="participantCount" class="muted">Loading participants...</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name / Email</th>
              <th>Referral</th>
              <th>Clicks</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="participantsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>Leaderboard</h2>
      <ol id="leaderboard"></ol>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore, collection, getDocs, doc, updateDoc,
  setDoc, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDxDjlzI_lEI1MbswR4lBbPJ8zspMRYdOY",
  authDomain: "rcreferral-contest.firebaseapp.com",
  projectId: "rcreferral-contest",
  storageBucket: "rcreferral-contest.firebasestorage.app",
  messagingSenderId: "137378826916",
  appId: "1:137378826916:web:45b695d41fbd3eb940f431",
  measurementId: "G-9QCXRR9V56"
};

const ADMIN_EMAIL = "akusu2841@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let participants = [];
let busy = false;

function showMessage(text, isError = false) {
  const el = $("message");
  el.textContent = text;
  el.className = isError ? "error" : "success";
}

function errorMessage(error) {
  console.error(error);
  const messages = {
    "permission-denied":
      "Permission denied. Check your published Firestore rules and admin email.",
    "unavailable":
      "Firebase is temporarily unavailable. Check your internet connection.",
    "not-found":
      "The Firebase document was not found. Refresh the dashboard."
  };
  showMessage(
    messages[error.code] ||
    `${error.code || "Error"}: ${error.message || "Operation failed"}`,
    true
  );
}

function setBusy(value) {
  busy = value;
  document.querySelectorAll("button, input, select").forEach(el => {
    if (el.id !== "search" && el.id !== "statusFilter") {
      el.disabled = value;
    }
  });
}

function requireAdmin(user) {
  if (!user || user.email !== ADMIN_EMAIL) {
    throw new Error("This account is not the configured admin account.");
  }
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    $("loginPanel").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    return;
  }

  if (user.email !== ADMIN_EMAIL) {
    showMessage("Access denied: this is not the configured admin email.", true);
    await signOut(auth);
    return;
  }

  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("loggedInAs").textContent = "Logged in as " + user.email;

  try {
    await loadAll();
  } catch (error) {
    errorMessage(error);
  }
});

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    await signInWithEmailAndPassword(
      auth, $("email").value.trim(), $("password").value
    );
    $("password").value = "";
    showMessage("Login successful.");
  } catch (error) {
    errorMessage(error);
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    showMessage("Logged out.");
  } catch (error) {
    errorMessage(error);
  }
});

async function loadAll() {
  requireAdmin(auth.currentUser);
  showMessage("Loading data...");

  const [participantSnapshot, prizeSnapshot] = await Promise.all([
    getDocs(collection(db, "participants")),
    getDoc(doc(db, "settings", "prizes"))
  ]);

  participants = participantSnapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));

  const prizes = prizeSnapshot.exists()
    ? prizeSnapshot.data()
    : { first: 100000, second: 50000, third: 20000 };

  $("prize1").value = prizes.first ?? 100000;
  $("prize2").value = prizes.second ?? 50000;
  $("prize3").value = prizes.third ?? 20000;

  renderParticipants();
  renderLeaderboard();
  showMessage(`Loaded ${participants.length} participant(s).`);
}

$("refreshBtn").addEventListener("click", async () => {
  try {
    await loadAll();
  } catch (error) {
    errorMessage(error);
  }
});

$("search").addEventListener("input", renderParticipants);
$("statusFilter").addEventListener("change", renderParticipants);

function renderParticipants() {
  const search = $("search").value.trim().toLowerCase();
  const filter = $("statusFilter").value;
  const body = $("participantsBody");
  body.replaceChildren();

  const filtered = participants.filter(p => {
    const matchesSearch =
      String(p.name || "").toLowerCase().includes(search) ||
      String(p.email || "").toLowerCase().includes(search);
    return matchesSearch && (filter === "all" || p.status === filter);
  });

  $("participantCount").textContent =
    `${filtered.length} participant(s) shown; ${participants.length} total.`;

  for (const p of filtered) {
    const tr = document.createElement("tr");

    const identity = document.createElement("td");
    identity.textContent = `${p.name || "Unnamed"}\n${p.email || ""}`;
    tr.append(identity);

    const referral = document.createElement("td");
    const referralLink = String(p.referral || "");
    referral.textContent = referralLink;
    tr.append(referral);

    const clicksCell = document.createElement("td");
    const clicks = document.createElement("input");
    clicks.type = "number";
    clicks.min = "0";
    clicks.step = "1";
    clicks.value = Math.max(0, Number(p.clicks) || 0);
    clicks.style.width = "90px";
    clicksCell.append(clicks);
    tr.append(clicksCell);

    const statusCell = document.createElement("td");
    statusCell.textContent = p.status || "pending";
    statusCell.className = "status";
    tr.append(statusCell);

    const actions = document.createElement("td");

    const saveClicks = document.createElement("button");
    saveClicks.textContent = "Save Clicks";
    saveClicks.addEventListener("click", async () => {
      const value = Number(clicks.value);
      if (!Number.isSafeInteger(value) || value < 0) {
        showMessage("Clicks must be a whole number of zero or more.", true);
        return;
      }
      await perform(async () => {
        await updateDoc(doc(db, "participants", p.id), { clicks: value });
        p.clicks = value;
      }, "Referral clicks saved.");
    });
    actions.append(saveClicks);

    for (const status of ["approved", "pending", "rejected"]) {
      const button = document.createElement("button");
      button.textContent =
        status === "approved" ? "Approve" :
        status === "rejected" ? "Reject" : "Set Pending";
      if (status === "rejected") button.className = "danger";

      button.addEventListener("click", async () => {
        await perform(async () => {
          await updateDoc(doc(db, "participants", p.id), { status });
          p.status = status;
          renderParticipants();
          renderLeaderboard();
        }, `Participant ${status}.`);
      });
      actions.append(button);
    }

    tr.append(actions);
    body.append(tr);
  }
}

function renderLeaderboard() {
  const list = $("leaderboard");
  list.replaceChildren();

  participants
    .filter(p => p.status === "approved")
    .sort((a, b) => (Number(b.clicks) || 0) - (Number(a.clicks) || 0))
    .forEach(p => {
      const li = document.createElement("li");
      li.textContent =
        `${p.name || "Unnamed"} — ${Number(p.clicks) || 0} clicks`;
      list.append(li);
    });
}

async function perform(operation, successText) {
  if (busy) return;
  setBusy(true);
  try {
    requireAdmin(auth.currentUser);
    await operation();
    renderLeaderboard();
    showMessage(successText);
  } catch (error) {
    errorMessage(error);
  } finally {
    setBusy(false);
  }
}

$("prizeForm").addEventListener("submit", async event => {
  event.preventDefault();

  const first = Number($("prize1").value);
  const second = Number($("prize2").value);
  const third = Number($("prize3").value);

  if (![first, second, third].every(
    value => Number.isSafeInteger(value) && value >= 0
  )) {
    showMessage("Enter valid whole-number prize amounts.", true);
    return;
  }

  await perform(async () => {
    await setDoc(doc(db, "settings", "prizes"), {
      first, second, third,
      updatedAt: serverTimestamp()
    });
  }, "Prize settings saved successfully.");
});
</script>
</body>
</html>
