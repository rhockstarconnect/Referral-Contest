
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/ref/*"
  to = "/.netlify/functions/track-click?code=:splat"
  status = 200
  force = true

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
